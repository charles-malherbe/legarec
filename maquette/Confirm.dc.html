<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Confirmation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Lora:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
/* tokens:start — charte graphique LEGAREC v1.0 (octobre 2026). Ne pas modifier à la main : généré depuis tools/tokens.css */
:root{
  /* Marque */
  --marine:#002B74; --marine-hover:#00225C; --marine-text:#002B74; --app-icon-bg:#002B74; --app-icon-fg:#FCBE03; --nuit:#001B4D; --or:#FCBE03; --or-clair:#FFF3C4; --ardoise:#5D7087;
  --bleu-pale:#EEF2F8; --gris-clair:#F6F8FB; --bleu-200:#D6E0F0; --white:#FFFFFF;
  /* Texte */
  --text:#0F1B2D; --text-2:#33455C; --text-3:#5D7087; --on-primary:#FFFFFF;
  /* Surfaces et bordures */
  --surface:#FFFFFF; --surface-2:#F6F8FB; --surface-3:#EEF2F7; --border:#E1E7EF; --border-strong:#7D8DA1;
  /* Surfaces sombres (carte d'appel, barre d'actions groupées) */
  --surface-dark:#001B4D; --surface-dark-2:#0B2D63; --border-dark:#2A4A7D; --on-dark:#FFFFFF; --on-dark-2:#D5DEEB; --on-dark-muted:#A9B8CC; --on-dark-accent:#B8CBEA;
  /* Données (graphiques, balance âgée) */
  --data-1:#C9D6EC; --data-2:#7F9CD0; --data-3:#345DA8;
  /* Tons sémantiques : fond, bordure, point, texte */
  --success-bg:#ECFDF5; --success-border:#A7F3D0; --success:#059669; --success-strong:#10B981; --success-fg:#047857; --on-success:#052E16;
  --warning-bg:#FFF3C4; --warning-border:#F5D77A; --warning:#D97706; --warning-fg:#8A4B08;
  --danger-bg:#FFF1F2; --danger-border:#FECDD3; --danger:#E11D48; --danger-fg:#BE123C; --danger-dark:#7F1D1D; --danger-on-dark:#FDA4AF;
  --info-bg:#F0F9FF; --info-border:#BAE6FD; --info:#0284C7; --info-fg:#0369A1;
  --violet-bg:#F5F3FF; --violet-border:#DDD6FE; --violet:#7C3AED; --violet-fg:#6D28D9;
  --teal-bg:#CCFBF1; --teal:#0D9488; --teal-fg:#115E59;
  /* Fonds pleins (badges pleins, texte --on-primary ≥ 5:1 dans les deux modes) */
  --solid-neutral:#33455C; --solid-info:#0369A1; --solid-success:#047857; --solid-warning:#8A4B08; --solid-danger:#BE123C; --solid-violet:#6D28D9; --solid-teal:#115E59;
  /* Typographie */
  --font-title:Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; --font-text:Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; --font-brand:Lora, Georgia, serif; --font-mono:ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-doc-xs:8px; --fs-doc-sm:9px; --fs-doc-md:10px; --fs-doc-lg:10.5px; --fs-2xs:11px; --fs-xs:12px; --fs-sm:13px; --fs-base:14px; --fs-md:16px; --fs-lg:18px; --fs-xl:20px; --fs-2xl:26px; --fs-3xl:34px;
  /* Rayons */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-full:9999px;
  /* Ombres */
  --shadow-sm:0 1px 2px 0 rgba(0,27,77,0.06); --shadow-md:0 10px 15px -3px rgba(0,27,77,0.10), 0 4px 6px -4px rgba(0,27,77,0.10); --shadow-lg:0 20px 25px -5px rgba(0,27,77,0.18), 0 8px 10px -6px rgba(0,27,77,0.12);
  --shadow-knob:0 1px 2px rgba(0,27,77,0.25); --overlay:rgba(0,27,77,0.55);
  /* Espacements (grille de 4 px) */
  --sp-0h:2px; --sp-1:4px; --sp-1h:6px; --sp-2:8px; --sp-2h:10px; --sp-3:12px; --sp-3h:14px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-11:44px; --sp-12:48px;
  /* Hauteurs de contrôles */
  --control-xs:28px; --control-sm:36px; --control-md:40px; --control-lg:44px;
  /* Voiles et anneaux (surfaces sombres, animations) */
  --veil-8:rgba(255,255,255,0.08); --veil-18:rgba(255,255,255,0.18); --veil-25:rgba(255,255,255,0.25); --veil-35:rgba(255,255,255,0.35); --veil-80:rgba(255,255,255,0.8); --veil-85:rgba(255,255,255,0.85); --on-success-veil:rgba(5,46,22,0.35); --success-ring:rgba(16,185,129,0.55); --success-ring-0:rgba(16,185,129,0);
  /* Cibles tactiles */
  --target:44px;
}
body{font-family:var(--font-text);font-feature-settings:"cv11";-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--font-title);font-weight:700;color:var(--marine);overflow-wrap:break-word;letter-spacing:-0.015em}
[data-brand] h1,[data-brand] h2{font-family:var(--font-brand);letter-spacing:0}
td,th,li,h3{overflow-wrap:break-word}
:focus-visible{outline:2px solid var(--marine);outline-offset:2px}
[data-dark] :focus-visible{outline-color:var(--or)}
button:disabled,[aria-disabled="true"]{cursor:not-allowed !important;opacity:.55}
button:not(:disabled):hover,a[href][style*="border-radius"]:hover{filter:brightness(.96)}
tbody tr:hover{background-color:var(--surface-2)}
[data-table-scroll]{max-height:min(68vh,720px);overflow:auto !important}
[data-table-scroll] thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);box-shadow:inset 0 -1px 0 var(--border)}
[data-skeleton]{display:block;border-radius:var(--r-xs);background:linear-gradient(90deg,var(--surface-3) 25%,var(--bleu-pale) 50%,var(--surface-3) 75%);background-size:200% 100%;animation:lg-sk 1.2s ease-in-out infinite}
@keyframes lg-sk{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
@media (pointer: coarse), (max-width: 767px){
  button,select,input:not([type=checkbox]):not([type=radio]):not([type=range]),[role=tab],[role=menuitem],a[href][style*="display: inline-flex"],a[href][style*="height:"]{min-height:var(--target)}
  input[type=checkbox],input[type=radio]{min-width:22px;min-height:22px}
}
/* Mode sombre : data-theme="dark" sur <html> */
:root[data-theme="dark"]{
  --marine:#2E5FC0; --marine-hover:#2A57B0; --marine-text:#9DB8F0; --app-icon-bg:#0A1A3F; --nuit:#071028; --or-clair:#3A2F0A; --ardoise:#9AA9BD;
  --bleu-pale:#1B2A4A; --gris-clair:#0A1020; --bleu-200:#2B3E63; --white:#16203A;
  --text:#E6ECF5; --text-2:#C3CEDD; --text-3:#9AA9BD;
  --surface:#0F1729; --surface-2:#0A1020; --surface-3:#1A2438; --border:#26324A; --border-strong:#67778F;
  --surface-dark:#050B1A; --surface-dark-2:#101C36; --border-dark:#24365A;
  --data-1:#2B3E63; --data-2:#4F73B8; --data-3:#7F9CD0;
  --success-bg:#0B2E22; --success-border:#14532D; --success-fg:#6EE7B7;
  --warning-bg:#3A2F0A; --warning-border:#6B5310; --warning-fg:#FCD34D;
  --danger-bg:#3B0D17; --danger-border:#7F1D2E; --danger-fg:#FDA4AF;
  --info-bg:#0B2540; --info-border:#164E63; --info-fg:#7DD3FC;
  --violet-bg:#24164A; --violet-border:#4C1D95; --violet-fg:#C4B5FD;
  --teal-bg:#0B302C; --teal-fg:#5EEAD4;
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,0.4); --shadow-md:0 10px 15px -3px rgba(0,0,0,0.5); --shadow-lg:0 20px 25px -5px rgba(0,0,0,0.6); --overlay:rgba(0,0,0,0.65);
  color-scheme:dark;
}
:root[data-theme="dark"] body{background:var(--surface-2);color:var(--text)}
:root[data-theme="dark"] :focus-visible{outline-color:#9DB8F0}
:root[data-theme="dark"] [data-dark]{border:1px solid var(--border-dark)}
:root[data-theme="dark"] h1,:root[data-theme="dark"] h2,:root[data-theme="dark"] a[href]:not([style*="background"]){color:var(--marine-text)}
:root[data-theme="dark"] [style*="color: var(--marine)"]:not([style*="background: var(--marine)"]){color:var(--marine-text) !important}
:root[data-theme="dark"] img[src*="_blob"]{background:var(--white);border-radius:var(--r-sm)}
/* Mode malvoyant : data-a11y="malvoyant" sur <html> — texte agrandi, contraste renforcé, cibles plus grandes */
:root[data-a11y="malvoyant"]{
  --fs-2xs:13px; --fs-xs:14px; --fs-sm:15px; --fs-base:17px; --fs-md:19px; --fs-lg:21px; --fs-xl:24px; --fs-2xl:30px; --fs-3xl:38px;
  --control-xs:36px; --control-sm:44px; --control-md:48px; --control-lg:52px; --target:48px;
  --text-3:var(--text-2); --ardoise:var(--text-2); --border:var(--border-strong);
}
:root[data-a11y="malvoyant"] body{line-height:1.6}
:root[data-a11y="malvoyant"] [data-sb-nav][style*="width: 264px"]{width:312px !important}
:root[data-a11y="malvoyant"] :focus-visible{outline:3px solid var(--or);outline-offset:3px;box-shadow:0 0 0 6px var(--marine)}
:root[data-a11y="malvoyant"] a[href]:not([style*="background"]){text-decoration:underline;text-underline-offset:3px}
:root[data-a11y="malvoyant"] button,:root[data-a11y="malvoyant"] select,:root[data-a11y="malvoyant"] input:not([type=checkbox]):not([type=radio]){min-height:var(--target)}
:root[data-a11y="malvoyant"] input[type=checkbox],:root[data-a11y="malvoyant"] input[type=radio]{min-width:24px;min-height:24px}
:root[data-a11y="malvoyant"][data-theme="dark"]{--text-3:#E6ECF5;--text-2:#E6ECF5}
/* tokens:end */
body{margin:0}
@keyframes cf-spin{to{transform:rotate(360deg)}}
@keyframes cf-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
[data-cf-btn]:focus-visible{outline:2px solid var(--marine);outline-offset:2px}
</style>
</helmet>
<div data-modal-open="{{openAttr}}" style="font-family: var(--font-text); color: var(--text)">
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<div onClick="{{backdrop}}" style="position: fixed; inset: 0; z-index: 400; background: var(--overlay); display: flex; align-items: center; justify-content: center; padding: var(--sp-4); box-sizing: border-box">
<div data-cf-dialog aria-busy="{{busyAttr}}" role="alertdialog" aria-modal="true" aria-labelledby="cf-titre" aria-describedby="cf-texte" onClick="{{stop}}" style="width: 100%; max-width: 480px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: cf-in .16s ease-out">
<div style="display: flex; gap: var(--sp-3h); padding: var(--sp-5) var(--sp-5) 0">
<span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: var(--r-full); display: flex; align-items: center; justify-content: center; background: {{iconBg}}; color: {{iconFg}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{icon}}"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1h)">
<h2 id="cf-titre" style="margin: 0; font-size: var(--fs-lg); line-height: 1.35; font-weight: 600">{{title}}</h2>
<p id="cf-texte" style="margin: 0; font-size: var(--fs-base); line-height: 1.55; color: var(--text-2)">{{body}}</p>
</div>
</div>
<sc-if value="{{hasDetails}}" hint-placeholder-val="{{ true }}">
<dl style="margin: var(--sp-4) var(--sp-5) 0; padding: var(--sp-3) var(--sp-3h); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--surface-3); display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--sp-1h) var(--sp-4); font-size: var(--fs-sm)">
<sc-for list="{{details}}" as="d" hint-placeholder-count="3"><dt style="color: var(--text-3)">{{d.k}}</dt><dd style="margin: 0; font-weight: 500; overflow-wrap: anywhere">{{d.v}}</dd></sc-for>
</dl>
</sc-if>
<sc-if value="{{hasReason}}" hint-placeholder-val="{{ false }}">
<label style="margin: var(--sp-4) var(--sp-5) 0; display: flex; flex-direction: column; gap: var(--sp-1h); font-size: var(--fs-sm); font-weight: 500; color: var(--text-2)">{{reasonLabel}}
<textarea data-cf-reason value="{{reason}}" onChange="{{onReason}}" rows="3" placeholder="{{reasonPlaceholder}}" style="font: inherit; font-size: var(--fs-base); padding: var(--sp-2h) var(--sp-3); border: 1px solid var(--border-strong); border-radius: var(--r-sm); resize: vertical; color: var(--text)"></textarea>
<span style="font-size: var(--fs-xs); font-weight: 400; color: var(--text-3)">Obligatoire · conservé dans le journal d'audit</span>
</label>
</sc-if>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: var(--sp-2); padding: var(--sp-5); margin-top: var(--sp-1)">
<span style="margin-right: auto; font-size: var(--fs-xs); color: var(--text-3)">Échap pour annuler</span>
<button data-cf-btn type="button" onClick="{{cancel}}" style="height: var(--control-md); padding: 0 var(--sp-3h); border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: var(--fs-base); font-weight: 500; cursor: pointer">{{cancelLabel}}</button>
<button data-cf-btn data-cf-primary type="button" onClick="{{confirm}}" disabled="{{disabled}}" style="height: var(--control-md); padding: 0 var(--sp-3h); border-radius: var(--r-sm); border: 0; font: inherit; font-size: var(--fs-base); font-weight: 600; cursor: {{cursor}}; background: {{btnBg}}; color: var(--on-primary); opacity: {{opacity}}"><sc-if value="{{pending}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="display: inline-block; width: 14px; height: 14px; margin-right: var(--sp-2); vertical-align: -2px; border-radius: var(--r-full); border: 2px solid currentColor; border-right-color: transparent; animation: cf-spin .8s linear infinite"></span></sc-if>{{btnLabel}}</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"open":{"editor":"boolean","default":true},"tone":{"editor":"enum","options":["primary","danger"],"default":"primary"},"title":{"editor":"text","default":"Confirmer cette action ?"},"body":{"editor":"text","default":"Cette action sera enregistrée dans le journal d&#39;audit."},"confirmLabel":{"editor":"text","default":"Confirmer"},"cancelLabel":{"editor":"text","default":"Annuler"},"reasonLabel":{"editor":"text","default":""},"details":{"editor":null},"onConfirm":{"editor":null},"onCancel":{"editor":null},"accent":{"editor":"color","default":"#002B74"},"$preview":{"width":640,"height":420}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { reason: '', pending: false };
  }
  componentDidMount() {
    this.onKey = (e) => {
      if (!this.isOpen()) return;
      if (e.key === 'Tab') {
        const box = document.querySelector('[data-cf-dialog]');
        if (!box) return;
        const els = [...box.querySelectorAll('button:not([disabled]), textarea, input, select, a[href]')];
        if (!els.length) return;
        const first = els[0], last = els[els.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        else if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
        return;
      }
      if (e.key === 'Escape') { e.preventDefault(); this.doCancel(); }
      else if (e.key === 'Enter' && (e.target.tagName !== 'TEXTAREA' || e.ctrlKey || e.metaKey)) {
        if (e.target.tagName === 'BUTTON' && !e.target.hasAttribute('data-cf-primary')) return;
        e.preventDefault(); this.doConfirm();
      }
    };
    document.addEventListener('keydown', this.onKey, true);
    this.focus();
  }
  componentDidUpdate(prev) {
    if (!prev.open && this.props.open) { this.prevFocus = document.activeElement; this.setState({ reason: '', pending: false }); this.focus(); }
    if (prev.open && !this.props.open && this.prevFocus && this.prevFocus.focus) { const el = this.prevFocus; this.prevFocus = null; setTimeout(() => el.focus(), 0); }
  }
  componentWillUnmount() { clearTimeout(this.pt); document.removeEventListener('keydown', this.onKey, true); }
  isOpen() { return (this.props.open ?? true) === true || this.props.open === 'true'; }
  focus() {
    setTimeout(() => {
      const el = document.querySelector(this.props.reasonLabel ? '[data-cf-reason]' : '[data-cf-primary]');
      if (el && this.isOpen()) el.focus();
    }, 30);
  }
  needsReason() { return !!this.props.reasonLabel; }
  doCancel() { if (this.props.onCancel) this.props.onCancel(); }
  doConfirm() {
    if (this.needsReason() && !this.state.reason.trim()) return;
    if (this.state.pending) return;
    const reason = this.state.reason.trim();
    this.setState({ pending: true });
    this.pt = setTimeout(() => { this.setState({ pending: false }); if (this.props.onConfirm) this.props.onConfirm(reason); }, 600);
  }
  renderVals() {
    const accent = this.props.accent ?? 'var(--marine)';
    const danger = (this.props.tone ?? 'primary') === 'danger';
    const open = this.isOpen();
    const blocked = this.needsReason() && !this.state.reason.trim();
    const busy = !!this.state.pending;
    const details = this.props.details ?? [{ k: 'Dossier', v: 'Bâtiplus SAS' }, { k: 'Montant', v: '29 600 €' }];
    return {
      open,
      openAttr: open ? 'true' : 'false',
      title: this.props.title ?? 'Confirmer cette action ?',
      body: this.props.body ?? 'Cette action sera enregistrée dans le journal d’audit.',
      confirmLabel: this.props.confirmLabel ?? 'Confirmer',
      btnLabel: this.state.pending ? 'Enregistrement en cours…' : (this.props.confirmLabel ?? 'Confirmer'),
      pending: !!this.state.pending,
      busyAttr: this.state.pending ? 'true' : 'false',
      cancelLabel: this.props.cancelLabel ?? 'Annuler',
      hasDetails: details.length > 0,
      details,
      hasReason: this.needsReason(),
      reasonLabel: this.props.reasonLabel ?? '',
      reasonPlaceholder: this.props.reasonPlaceholder ?? 'Précisez le motif…',
      reason: this.state.reason,
      onReason: (e) => this.setState({ reason: e.target.value }),
      icon: danger ? 'M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01' : 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01',
      iconBg: danger ? 'var(--danger-bg)' : 'var(--bleu-pale)',
      iconFg: danger ? 'var(--danger-fg)' : accent,
      btnBg: danger ? 'var(--danger-fg)' : accent,
      disabled: blocked || !!this.state.pending,
      opacity: blocked ? '0.5' : busy ? '0.8' : '1',
      cursor: blocked ? 'not-allowed' : 'pointer',
      backdrop: () => this.doCancel(),
      stop: (e) => e.stopPropagation(),
      cancel: () => this.doCancel(),
      confirm: () => this.doConfirm()
    };
  }
}
</script>
</body>
</html>
