<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Legarec – Erreur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Lora:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
/* tokens:start — charte graphique LEGAREC v1.0 (octobre 2026). Ne pas modifier à la main : généré depuis tools/tokens.css */
:root{
  /* Marque */
  --marine:#002B74; --marine-hover:#00225C; --marine-text:#002B74; --app-icon-bg:#002B74; --app-icon-fg:#FCBE03; --nuit:#001B4D; --or:#FCBE03; --or-clair:#FFF3C4; --ardoise:#5D7087;
  --bleu-pale:#EEF2F8; --gris-clair:#F6F8FB; --bleu-200:#D6E0F0; --white:#FFFFFF;
  /* Texte */
  --text:#0F1B2D; --text-2:#33455C; --text-3:#5D7087; --on-primary:#FFFFFF;
  /* Surfaces et bordures */
  --surface:#FFFFFF; --surface-2:#F6F8FB; --surface-3:#EEF2F7; --border:#E1E7EF; --border-strong:#7D8DA1;
  /* Surfaces sombres (carte d'appel, barre d'actions groupées) */
  --surface-dark:#001B4D; --surface-dark-2:#0B2D63; --border-dark:#2A4A7D; --on-dark:#FFFFFF; --on-dark-2:#D5DEEB; --on-dark-muted:#A9B8CC; --on-dark-accent:#B8CBEA;
  /* Données (graphiques, balance âgée) */
  --data-1:#C9D6EC; --data-2:#7F9CD0; --data-3:#345DA8;
  /* Tons sémantiques : fond, bordure, point, texte */
  --success-bg:#ECFDF5; --success-border:#A7F3D0; --success:#059669; --success-strong:#10B981; --success-fg:#047857; --on-success:#052E16;
  --warning-bg:#FFF3C4; --warning-border:#F5D77A; --warning:#D97706; --warning-fg:#8A4B08;
  --danger-bg:#FFF1F2; --danger-border:#FECDD3; --danger:#E11D48; --danger-fg:#BE123C; --danger-dark:#7F1D1D; --danger-on-dark:#FDA4AF;
  --info-bg:#F0F9FF; --info-border:#BAE6FD; --info:#0284C7; --info-fg:#0369A1;
  --violet-bg:#F5F3FF; --violet-border:#DDD6FE; --violet:#7C3AED; --violet-fg:#6D28D9;
  --teal-bg:#CCFBF1; --teal:#0D9488; --teal-fg:#115E59;
  /* Fonds pleins (badges pleins, texte --on-primary ≥ 5:1 dans les deux modes) */
  --solid-neutral:#33455C; --solid-info:#0369A1; --solid-success:#047857; --solid-warning:#8A4B08; --solid-danger:#BE123C; --solid-violet:#6D28D9; --solid-teal:#115E59;
  /* Typographie */
  --font-title:Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; --font-text:Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; --font-brand:Lora, Georgia, serif; --font-mono:ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-doc-xs:8px; --fs-doc-sm:9px; --fs-doc-md:10px; --fs-doc-lg:10.5px; --fs-2xs:11px; --fs-xs:12px; --fs-sm:13px; --fs-base:14px; --fs-md:16px; --fs-lg:18px; --fs-xl:20px; --fs-2xl:26px; --fs-3xl:34px;
  /* Rayons */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-full:9999px;
  /* Ombres */
  --shadow-sm:0 1px 2px 0 rgba(0,27,77,0.06); --shadow-md:0 10px 15px -3px rgba(0,27,77,0.10), 0 4px 6px -4px rgba(0,27,77,0.10); --shadow-lg:0 20px 25px -5px rgba(0,27,77,0.18), 0 8px 10px -6px rgba(0,27,77,0.12);
  --shadow-knob:0 1px 2px rgba(0,27,77,0.25); --overlay:rgba(0,27,77,0.55);
  /* Espacements (grille de 4 px) */
  --sp-0h:2px; --sp-1:4px; --sp-1h:6px; --sp-2:8px; --sp-2h:10px; --sp-3:12px; --sp-3h:14px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-11:44px; --sp-12:48px;
  /* Hauteurs de contrôles */
  --control-xs:28px; --control-sm:36px; --control-md:40px; --control-lg:44px;
  /* Voiles et anneaux (surfaces sombres, animations) */
  --veil-8:rgba(255,255,255,0.08); --veil-18:rgba(255,255,255,0.18); --veil-25:rgba(255,255,255,0.25); --veil-35:rgba(255,255,255,0.35); --veil-80:rgba(255,255,255,0.8); --veil-85:rgba(255,255,255,0.85); --on-success-veil:rgba(5,46,22,0.35); --success-ring:rgba(16,185,129,0.55); --success-ring-0:rgba(16,185,129,0);
  /* Cibles tactiles */
  --target:44px;
}
body{font-family:var(--font-text);font-feature-settings:"cv11";-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--font-title);font-weight:700;color:var(--marine);overflow-wrap:break-word;letter-spacing:-0.015em}
[data-brand] h1,[data-brand] h2{font-family:var(--font-brand);letter-spacing:0}
td,th,li,h3{overflow-wrap:break-word}
:focus-visible{outline:2px solid var(--marine);outline-offset:2px}
[data-dark] :focus-visible{outline-color:var(--or)}
button:disabled,[aria-disabled="true"]{cursor:not-allowed !important;opacity:.55}
button:not(:disabled):hover,a[href][style*="border-radius"]:hover{filter:brightness(.96)}
tbody tr:hover{background-color:var(--surface-2)}
[data-table-scroll]{max-height:min(68vh,720px);overflow:auto !important}
[data-table-scroll] thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);box-shadow:inset 0 -1px 0 var(--border)}
[data-skeleton]{display:block;border-radius:var(--r-xs);background:linear-gradient(90deg,var(--surface-3) 25%,var(--bleu-pale) 50%,var(--surface-3) 75%);background-size:200% 100%;animation:lg-sk 1.2s ease-in-out infinite}
@keyframes lg-sk{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
@media (pointer: coarse), (max-width: 767px){
  button,select,input:not([type=checkbox]):not([type=radio]):not([type=range]),[role=tab],[role=menuitem],a[href][style*="display: inline-flex"],a[href][style*="height:"]{min-height:var(--target)}
  input[type=checkbox],input[type=radio]{min-width:22px;min-height:22px}
}
/* Mode sombre : data-theme="dark" sur <html> */
:root[data-theme="dark"]{
  --marine:#2E5FC0; --marine-hover:#2A57B0; --marine-text:#9DB8F0; --app-icon-bg:#0A1A3F; --nuit:#071028; --or-clair:#3A2F0A; --ardoise:#9AA9BD;
  --bleu-pale:#1B2A4A; --gris-clair:#0A1020; --bleu-200:#2B3E63; --white:#16203A;
  --text:#E6ECF5; --text-2:#C3CEDD; --text-3:#9AA9BD;
  --surface:#0F1729; --surface-2:#0A1020; --surface-3:#1A2438; --border:#26324A; --border-strong:#67778F;
  --surface-dark:#050B1A; --surface-dark-2:#101C36; --border-dark:#24365A;
  --data-1:#2B3E63; --data-2:#4F73B8; --data-3:#7F9CD0;
  --success-bg:#0B2E22; --success-border:#14532D; --success-fg:#6EE7B7;
  --warning-bg:#3A2F0A; --warning-border:#6B5310; --warning-fg:#FCD34D;
  --danger-bg:#3B0D17; --danger-border:#7F1D2E; --danger-fg:#FDA4AF;
  --info-bg:#0B2540; --info-border:#164E63; --info-fg:#7DD3FC;
  --violet-bg:#24164A; --violet-border:#4C1D95; --violet-fg:#C4B5FD;
  --teal-bg:#0B302C; --teal-fg:#5EEAD4;
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,0.4); --shadow-md:0 10px 15px -3px rgba(0,0,0,0.5); --shadow-lg:0 20px 25px -5px rgba(0,0,0,0.6); --overlay:rgba(0,0,0,0.65);
  color-scheme:dark;
}
:root[data-theme="dark"] body{background:var(--surface-2);color:var(--text)}
:root[data-theme="dark"] :focus-visible{outline-color:#9DB8F0}
:root[data-theme="dark"] [data-dark]{border:1px solid var(--border-dark)}
:root[data-theme="dark"] h1,:root[data-theme="dark"] h2,:root[data-theme="dark"] a[href]:not([style*="background"]){color:var(--marine-text)}
:root[data-theme="dark"] [style*="color: var(--marine)"]:not([style*="background: var(--marine)"]){color:var(--marine-text) !important}
:root[data-theme="dark"] img[src*="_blob"]{background:var(--white);border-radius:var(--r-sm)}
/* Mode malvoyant : data-a11y="malvoyant" sur <html> — texte agrandi, contraste renforcé, cibles plus grandes */
:root[data-a11y="malvoyant"]{
  --fs-2xs:13px; --fs-xs:14px; --fs-sm:15px; --fs-base:17px; --fs-md:19px; --fs-lg:21px; --fs-xl:24px; --fs-2xl:30px; --fs-3xl:38px;
  --control-xs:36px; --control-sm:44px; --control-md:48px; --control-lg:52px; --target:48px;
  --text-3:var(--text-2); --ardoise:var(--text-2); --border:var(--border-strong);
}
:root[data-a11y="malvoyant"] body{line-height:1.6}
:root[data-a11y="malvoyant"] [data-sb-nav][style*="width: 264px"]{width:312px !important}
:root[data-a11y="malvoyant"] :focus-visible{outline:3px solid var(--or);outline-offset:3px;box-shadow:0 0 0 6px var(--marine)}
:root[data-a11y="malvoyant"] a[href]:not([style*="background"]){text-decoration:underline;text-underline-offset:3px}
:root[data-a11y="malvoyant"] button,:root[data-a11y="malvoyant"] select,:root[data-a11y="malvoyant"] input:not([type=checkbox]):not([type=radio]){min-height:var(--target)}
:root[data-a11y="malvoyant"] input[type=checkbox],:root[data-a11y="malvoyant"] input[type=radio]{min-width:24px;min-height:24px}
:root[data-a11y="malvoyant"][data-theme="dark"]{--text-3:#E6ECF5;--text-2:#E6ECF5}
/* tokens:end */
body{margin:0;background:var(--surface-2)}
</style>
</helmet>
<main data-brand style="min-height: 100vh; box-sizing: border-box; padding: var(--sp-8) var(--sp-4); display: flex; align-items: center; justify-content: center; background: var(--surface-2); font-family: var(--font-text); color: var(--text)">
<div style="width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-4)">
<a href="Main.dc.html" aria-label="Legarec, accueil" style="display: flex; align-items: center; gap: var(--sp-2h); text-decoration: none"><span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: var(--r-md); background: var(--app-icon-bg); color: var(--app-icon-fg); display: flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: var(--fs-xl); font-weight: 700; line-height: 1">L</span><span style="font-family: var(--font-title); font-size: var(--fs-lg); font-weight: 700; color: var(--marine)">Legarec</span></a>
<span style="font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3)">Erreur {{code}}</span>
<h1 style="margin: 0; font-size: var(--fs-3xl); line-height: 1.2">{{title}}</h1>
<span aria-hidden="true" style="width: 44px; height: 4px; border-radius: var(--r-full); background: var(--or)"></span>
<p style="margin: 0; font-size: var(--fs-md); line-height: 1.6; color: var(--text-2)">{{text}}</p>
<div style="display: flex; flex-wrap: wrap; gap: var(--sp-2)">
<dc-import name="Bouton" variant="primary" size="lg" label="Retour au tableau de bord" href="Main.dc.html" style="display: contents" hint-size="120px,40px"></dc-import>
<dc-import name="Bouton" variant="secondary" size="lg" label="{{secondLabel}}" href="{{secondHref}}" style="display: contents" hint-size="120px,40px"></dc-import>
</div>
<span style="font-size: var(--fs-sm); color: var(--text-3)">Référence à communiquer au support : <code style="font-family: var(--font-mono)">{{ref}}</code> · administratif@legarec.fr</span>
<div style="align-self: stretch; padding-top: var(--sp-4); border-top: 1px solid var(--border)"><dc-import name="PiedDePage" variant="integre" aide="true" style="display: contents" hint-size="100%,72px"></dc-import></div>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"code":{"editor":"enum","options":["403","404","500"],"default":"404"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const code = String(this.props.code ?? '404');
    const E = {
      '403': ['Accès réservé', 'Cette page est réservée à d’autres rôles. Si vous pensez en avoir besoin, demandez l’accès à un responsable du recouvrement.', 'Voir mes droits', 'Compte.dc.html'],
      '404': ['Page introuvable', 'Le lien est peut-être ancien, ou le dossier a été archivé. Utilisez la recherche pour le retrouver par nom, SIRET ou numéro de facture.', 'Centre d’aide', 'Aide.dc.html'],
      '500': ['Un incident technique est en cours', 'Votre action n’a pas été enregistrée. Nos équipes sont prévenues automatiquement ; réessayez dans quelques minutes.', 'État des services', 'Aide.dc.html']
    };
    const e = E[code] || E['404'];
    return { code, title: e[0], text: e[1], secondLabel: e[2], secondHref: e[3], ref: 'LGR-' + code + '-7F3A2C' };
  }
}
</script>
</body>
</html>
