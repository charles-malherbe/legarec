</head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Lora:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
/* tokens:start — charte graphique LEGAREC v1.0 (octobre 2026). Ne pas modifier à la main : généré depuis tools/tokens.css */
:root{
  /* Marque */
  --marine:#002B74; --marine-hover:#00225C; --marine-text:#002B74; --app-icon-bg:#002B74; --app-icon-fg:#FCBE03; --nuit:#001B4D; --or:#FCBE03; --or-clair:#FFF3C4; --ardoise:#5D7087;
  --bleu-pale:#EEF2F8; --gris-clair:#F6F8FB; --bleu-200:#D6E0F0; --white:#FFFFFF;
  /* Texte */
  --text:#0F1B2D; --text-2:#33455C; --text-3:#5D7087; --on-primary:#FFFFFF;
  /* Surfaces et bordures */
  --surface:#FFFFFF; --surface-2:#F6F8FB; --surface-3:#EEF2F7; --border:#E1E7EF; --border-strong:#7D8DA1;
  /* Surfaces sombres (carte d'appel, barre d'actions groupées) */
  --surface-dark:#001B4D; --surface-dark-2:#0B2D63; --border-dark:#2A4A7D; --on-dark:#FFFFFF; --on-dark-2:#D5DEEB; --on-dark-muted:#A9B8CC; --on-dark-accent:#B8CBEA;
  /* Données (graphiques, balance âgée) */
  --data-1:#C9D6EC; --data-2:#7F9CD0; --data-3:#345DA8;
  /* Tons sémantiques : fond, bordure, point, texte */
  --success-bg:#ECFDF5; --success-border:#A7F3D0; --success:#059669; --success-strong:#10B981; --success-fg:#047857; --on-success:#052E16;
  --warning-bg:#FFF3C4; --warning-border:#F5D77A; --warning:#D97706; --warning-fg:#8A4B08;
  --danger-bg:#FFF1F2; --danger-border:#FECDD3; --danger:#E11D48; --danger-fg:#BE123C; --danger-dark:#7F1D1D; --danger-on-dark:#FDA4AF;
  --info-bg:#F0F9FF; --info-border:#BAE6FD; --info:#0284C7; --info-fg:#0369A1;
  --violet-bg:#F5F3FF; --violet-border:#DDD6FE; --violet:#7C3AED; --violet-fg:#6D28D9;
  --teal-bg:#CCFBF1; --teal:#0D9488; --teal-fg:#115E59;
  /* Fonds pleins (badges pleins, texte --on-primary ≥ 5:1 dans les deux modes) */
  --solid-neutral:#33455C; --solid-info:#0369A1; --solid-success:#047857; --solid-warning:#8A4B08; --solid-danger:#BE123C; --solid-violet:#6D28D9; --solid-teal:#115E59;
  /* Typographie */
  --font-title:Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; --font-text:Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; --font-brand:Lora, Georgia, serif; --font-mono:ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-doc-xs:8px; --fs-doc-sm:9px; --fs-doc-md:10px; --fs-doc-lg:10.5px; --fs-2xs:11px; --fs-xs:12px; --fs-sm:13px; --fs-base:14px; --fs-md:16px; --fs-lg:18px; --fs-xl:20px; --fs-2xl:26px; --fs-3xl:34px;
  /* Rayons */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-full:9999px;
  /* Ombres */
  --shadow-sm:0 1px 2px 0 rgba(0,27,77,0.06); --shadow-md:0 10px 15px -3px rgba(0,27,77,0.10), 0 4px 6px -4px rgba(0,27,77,0.10); --shadow-lg:0 20px 25px -5px rgba(0,27,77,0.18), 0 8px 10px -6px rgba(0,27,77,0.12);
  --shadow-knob:0 1px 2px rgba(0,27,77,0.25); --overlay:rgba(0,27,77,0.55);
  /* Espacements (grille de 4 px) */
  --sp-0h:2px; --sp-1:4px; --sp-1h:6px; --sp-2:8px; --sp-2h:10px; --sp-3:12px; --sp-3h:14px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-11:44px; --sp-12:48px;
  /* Hauteurs de contrôles */
  --control-xs:28px; --control-sm:36px; --control-md:40px; --control-lg:44px;
  /* Voiles et anneaux (surfaces sombres, animations) */
  --veil-8:rgba(255,255,255,0.08); --veil-18:rgba(255,255,255,0.18); --veil-25:rgba(255,255,255,0.25); --veil-35:rgba(255,255,255,0.35); --veil-80:rgba(255,255,255,0.8); --veil-85:rgba(255,255,255,0.85); --on-success-veil:rgba(5,46,22,0.35); --success-ring:rgba(16,185,129,0.55); --success-ring-0:rgba(16,185,129,0);
  /* Cibles tactiles */
  --target:44px;
}
body{font-family:var(--font-text);font-feature-settings:"cv11";-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--font-title);font-weight:700;color:var(--marine);overflow-wrap:break-word;letter-spacing:-0.015em}
[data-brand] h1,[data-brand] h2{font-family:var(--font-brand);letter-spacing:0}
td,th,li,h3{overflow-wrap:break-word}
:focus-visible{outline:2px solid var(--marine);outline-offset:2px}
[data-dark] :focus-visible{outline-color:var(--or)}
button:disabled,[aria-disabled="true"]{cursor:not-allowed !important;opacity:.55}
button:not(:disabled):hover,a[href][style*="border-radius"]:hover{filter:brightness(.96)}
tbody tr:hover{background-color:var(--surface-2)}
[data-table-scroll]{max-height:min(68vh,720px);overflow:auto !important}
[data-table-scroll] thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);box-shadow:inset 0 -1px 0 var(--border)}
[data-skeleton]{display:block;border-radius:var(--r-xs);background:linear-gradient(90deg,var(--surface-3) 25%,var(--bleu-pale) 50%,var(--surface-3) 75%);background-size:200% 100%;animation:lg-sk 1.2s ease-in-out infinite}
@keyframes lg-sk{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
@media (pointer: coarse), (max-width: 767px){
  button,select,input:not([type=checkbox]):not([type=radio]):not([type=range]),[role=tab],[role=menuitem],a[href][style*="display: inline-flex"],a[href][style*="height:"]{min-height:var(--target)}
  input[type=checkbox],input[type=radio]{min-width:22px;min-height:22px}
}
/* Mode sombre : data-theme="dark" sur <html> */
:root[data-theme="dark"]{
  --marine:#2E5FC0; --marine-hover:#2A57B0; --marine-text:#9DB8F0; --app-icon-bg:#0A1A3F; --nuit:#071028; --or-clair:#3A2F0A; --ardoise:#9AA9BD;
  --bleu-pale:#1B2A4A; --gris-clair:#0A1020; --bleu-200:#2B3E63; --white:#16203A;
  --text:#E6ECF5; --text-2:#C3CEDD; --text-3:#9AA9BD;
  --surface:#0F1729; --surface-2:#0A1020; --surface-3:#1A2438; --border:#26324A; --border-strong:#67778F;
  --surface-dark:#050B1A; --surface-dark-2:#101C36; --border-dark:#24365A;
  --data-1:#2B3E63; --data-2:#4F73B8; --data-3:#7F9CD0;
  --success-bg:#0B2E22; --success-border:#14532D; --success-fg:#6EE7B7;
  --warning-bg:#3A2F0A; --warning-border:#6B5310; --warning-fg:#FCD34D;
  --danger-bg:#3B0D17; --danger-border:#7F1D2E; --danger-fg:#FDA4AF;
  --info-bg:#0B2540; --info-border:#164E63; --info-fg:#7DD3FC;
  --violet-bg:#24164A; --violet-border:#4C1D95; --violet-fg:#C4B5FD;
  --teal-bg:#0B302C; --teal-fg:#5EEAD4;
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,0.4); --shadow-md:0 10px 15px -3px rgba(0,0,0,0.5); --shadow-lg:0 20px 25px -5px rgba(0,0,0,0.6); --overlay:rgba(0,0,0,0.65);
  color-scheme:dark;
}
:root[data-theme="dark"] body{background:var(--surface-2);color:var(--text)}
:root[data-theme="dark"] :focus-visible{outline-color:#9DB8F0}
:root[data-theme="dark"] [data-dark]{border:1px solid var(--border-dark)}
:root[data-theme="dark"] h1,:root[data-theme="dark"] h2,:root[data-theme="dark"] a[href]:not([style*="background"]){color:var(--marine-text)}
:root[data-theme="dark"] [style*="color: var(--marine)"]:not([style*="background: var(--marine)"]){color:var(--marine-text) !important}
:root[data-theme="dark"] img[src*="_blob"]{background:var(--white);border-radius:var(--r-sm)}
/* Mode malvoyant : data-a11y="malvoyant" sur <html> — texte agrandi, contraste renforcé, cibles plus grandes */
:root[data-a11y="malvoyant"]{
  --fs-2xs:13px; --fs-xs:14px; --fs-sm:15px; --fs-base:17px; --fs-md:19px; --fs-lg:21px; --fs-xl:24px; --fs-2xl:30px; --fs-3xl:38px;
  --control-xs:36px; --control-sm:44px; --control-md:48px; --control-lg:52px; --target:48px;
  --text-3:var(--text-2); --ardoise:var(--text-2); --border:var(--border-strong);
}
:root[data-a11y="malvoyant"] body{line-height:1.6}
:root[data-a11y="malvoyant"] [data-sb-nav][style*="width: 264px"]{width:312px !important}
:root[data-a11y="malvoyant"] :focus-visible{outline:3px solid var(--or);outline-offset:3px;box-shadow:0 0 0 6px var(--marine)}
:root[data-a11y="malvoyant"] a[href]:not([style*="background"]){text-decoration:underline;text-underline-offset:3px}
:root[data-a11y="malvoyant"] button,:root[data-a11y="malvoyant"] select,:root[data-a11y="malvoyant"] input:not([type=checkbox]):not([type=radio]){min-height:var(--target)}
:root[data-a11y="malvoyant"] input[type=checkbox],:root[data-a11y="malvoyant"] input[type=radio]{min-width:24px;min-height:24px}
:root[data-a11y="malvoyant"][data-theme="dark"]{--text-3:#E6ECF5;--text-2:#E6ECF5}
/* tokens:end */
body{margin:0}
[data-sb-nav] a:focus-visible,[data-sb-nav] button:focus-visible,[data-sb-mobile] a:focus-visible,[data-sb-mobile] button:focus-visible{outline:2px solid var(--marine);outline-offset:1px}
[data-sb-close]{display:none}
@media (min-width: 1024px){[data-sb-nav]{position:sticky !important;top:0;height:100vh;min-height:0 !important;overflow-y:auto;scrollbar-width:thin}[data-sb-nav][style*="width: 68px"]{overflow:visible}[data-sb-nav][style*="width: 264px"] [data-sb-menu]{width:100% !important}}
@media (max-width: 1023px){
  [data-sb-wrap]{flex:1 1 100% !important;border-right:0 !important;border-bottom:1px solid var(--border) !important;position:relative;z-index:70}
  [data-sb-root]{width:100%}
  [data-sb-nav]{display:none !important}
  [data-sb-nav][data-open="true"]{display:flex !important;position:fixed !important;top:0;left:0;bottom:0;width:300px !important;max-width:86vw;min-height:0 !important;overflow-y:auto;z-index:500 !important;box-shadow:var(--shadow-lg)}
  [data-sb-mobile]{display:flex !important}
  [data-sb-backdrop]{display:block !important}
  [data-sb-collapse]{display:none !important}
  [data-sb-close]{display:flex !important}
}
</style>
</helmet>
<div data-sb-root style="display: flex; flex-direction: column">
<div data-sb-mobile style="display: none; align-items: center; gap: var(--sp-2h); height: 56px; padding: 0 var(--sp-3); box-sizing: border-box; width: 100%; background: var(--surface); font-family: var(--font-text); color: var(--text)">
<button data-sb-burger type="button" onClick="{{openDrawer}}" aria-label="Ouvrir le menu" aria-expanded="{{drawerAttr}}" style="width: 40px; height: var(--control-md); border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); color: var(--text-2); cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: var(--sp-2); text-decoration: none"><span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: var(--r-md); background: var(--app-icon-bg); color: var(--app-icon-fg); display: flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: var(--fs-xl); font-weight: 700; line-height: 1">L</span><span style="font-size: var(--fs-md); font-weight: 700; letter-spacing: -0.01em; color: var(--marine)">Legarec</span></a>
<span style="margin-left: auto; min-width: 0; font-size: var(--fs-sm); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cur.name}}</span>
</div>
<sc-if value="{{drawer}}" hint-placeholder-val="{{ false }}"><div data-sb-backdrop onClick="{{closeDrawer}}" style="display: none; position: fixed; inset: 0; z-index: 490; background: var(--overlay)"></div></sc-if>
<nav data-sb-nav data-open="{{drawerAttr}}" aria-label="Navigation principale" style="position: relative; z-index: 60; width: {{width}}; min-height: 100vh; box-sizing: border-box; padding: var(--sp-3) var(--sp-2h); display: flex; flex-direction: column; gap: var(--sp-3); font-family: var(--font-text); color: var(--text); background: var(--surface-2)">

<div style="display: flex; align-items: center; justify-content: {{headJustify}}; gap: var(--sp-2); min-height: 64px; margin: -12px -10px 0; padding: 0 var(--sp-3) 0 var(--sp-4); box-sizing: border-box; border-bottom: 1px solid var(--border); background: var(--surface-2)">
<sc-if value="{{expanded}}" hint-placeholder-val="{{ true }}">
<a href="Main.dc.html" aria-label="Legarec, espace cabinet, retour au tableau de bord" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--sp-2h); text-decoration: none">
<span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: var(--r-md); background: var(--app-icon-bg); color: var(--app-icon-fg); display: flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: var(--fs-xl); font-weight: 700; line-height: 1">L</span>
<span style="min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1)">
<span style="font-size: var(--fs-lg); font-weight: 700; line-height: 1; letter-spacing: -0.015em; color: var(--marine)">Legarec</span>
<span style="font-size: var(--fs-xs); line-height: 1.2; color: var(--text-3); white-space: nowrap">Recouvrement de créances</span>
</span>
</a>
</sc-if>
<sc-if value="{{collapsedHead}}" hint-placeholder-val="{{ false }}"><a href="Main.dc.html" aria-label="Legarec, retour au tableau de bord" style="display: flex; text-decoration: none"><span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: var(--r-md); background: var(--app-icon-bg); color: var(--app-icon-fg); display: flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: var(--fs-xl); font-weight: 700; line-height: 1">L</span></a></sc-if>
<button data-sb-close type="button" onClick="{{closeDrawer}}" aria-label="Fermer le menu" style="width: 40px; height: var(--control-md); flex-shrink: 0; border: 0; border-radius: var(--r-sm); background: transparent; cursor: pointer; align-items: center; justify-content: center; color: var(--text-2)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>

<div style="position: relative; z-index: 30">
<button type="button" onClick="{{toggleSwitcher}}" aria-expanded="{{switcherExpanded}}" aria-haspopup="listbox" aria-label="Changer de créancier, actuellement {{cur.name}}" title="{{cur.tip}}" style="width: 100%; display: flex; align-items: center; justify-content: {{headJustify}}; gap: var(--sp-2h); padding: var(--sp-1h); min-height: 48px; box-sizing: border-box; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-sm); font: inherit; cursor: pointer; text-align: left; color: var(--text)">
<span style="width: 34px; height: 34px; border-radius: var(--r-sm); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: var(--fs-xs); font-weight: 700; background: {{cur.bg}}; color: {{cur.fg}}">
<sc-if value="{{cur.isAll}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg></sc-if>
<sc-if value="{{cur.isOne}}" hint-placeholder-val="{{ false }}">{{cur.ini}}</sc-if>
</span>
<sc-if value="{{expanded}}" hint-placeholder-val="{{ true }}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: var(--fs-xs); color: var(--text-3)">{{cur.caption}}</span><span style="font-size: var(--fs-base); font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cur.name}}</span></span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" style="stroke: var(--text-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"></path></svg>
</sc-if>
</button>
<sc-if value="{{switcherOpen}}" hint-placeholder-val="{{ false }}">
<div data-sb-menu style="position: absolute; z-index: 100; top: 54px; left: 0; width: 264px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-md); padding: var(--sp-1); display: flex; flex-direction: column">
<span style="padding: var(--sp-1h) var(--sp-2) var(--sp-1); font-size: var(--fs-xs); font-weight: 500; color: var(--text-3)">Afficher les données de</span>
<ul role="listbox" aria-label="Créanciers" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{mandants}}" as="m" hint-placeholder-count="6">
<li role="option" aria-selected="{{m.selected}}">
<button type="button" onClick="{{m.pick}}" style="width: 100%; display: flex; align-items: center; gap: var(--sp-2h); padding: var(--sp-1h) var(--sp-2); min-height: 40px; border: 0; border-radius: var(--r-sm); font: inherit; cursor: pointer; text-align: left; color: var(--text); background: {{m.rowBg}}">
<span style="width: 26px; height: 26px; border-radius: var(--r-sm); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: var(--fs-xs); font-weight: 700; background: {{m.bg}}; color: {{m.fg}}">{{m.ini}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: var(--fs-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.name}}</span><sc-if value="{{m.hasSiren}}" hint-placeholder-val="{{ true }}"><span style="font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums">SIREN {{m.siren}}</span></sc-if></span>
<span style="font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums">{{m.count}}</span>
<span style="width: 16px; display: flex; justify-content: center"><sc-if value="{{m.isSel}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" style="stroke: var(--marine)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
</button>
</li>
</sc-for>
</ul>
<div style="height: 1px; background: var(--border); margin: var(--sp-1) 0"></div>
<a href="Mandants.dc.html" style="display: flex; align-items: center; gap: var(--sp-2h); padding: var(--sp-2); min-height: 40px; box-sizing: border-box; border-radius: var(--r-sm); font-size: var(--fs-base); color: var(--text); text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" style="stroke: var(--text-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>Ajouter ou gérer les créanciers</a>
</div>
</sc-if>
</div>

<div style="display: flex; flex-direction: column; gap: var(--sp-2h)">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 1px">
<sc-if value="{{g.showLabel}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{g.toggle}}" aria-expanded="{{g.ariaOpen}}" style="display: flex; align-items: center; justify-content: space-between; height: var(--control-xs); padding: 0 var(--sp-2h); border: 0; border-radius: var(--r-sm); background: transparent; font: inherit; font-size: var(--fs-xs); font-weight: 500; color: var(--text-3); cursor: pointer; text-align: left">{{g.label}}<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" style="stroke: var(--text-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.chev}}"></path></svg></button>
</sc-if>
<sc-if value="{{g.showRule}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="display: block; height: 1px; background: var(--border); margin: var(--sp-1h) var(--sp-2h)"></span></sc-if>
<sc-if value="{{g.open}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column">
<div style="position: relative; display: flex; align-items: center">
