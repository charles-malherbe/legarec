# PostgreSQL of production. The values that the data folder carries (locale, checksums) were set when it was created.
hba_file = '/etc/legarec/pg_hba.conf'
listen_addresses = '*'
unix_socket_directories = '/var/run/postgresql'
max_connections = 60
password_encryption = 'scram-sha-256'
timezone = 'UTC'
log_timezone = 'UTC'
lc_messages = 'C'

# Container limited to 1.5 GB (docker-compose.yml).
shared_buffers = 384MB
effective_cache_size = 900MB
work_mem = 8MB
maintenance_work_mem = 96MB
max_wal_size = 2GB
random_page_cost = 1.1

# Backups: every change leaves within five minutes. Beyond archive-push-queue-max (pgbackrest.conf), the journal is
# dropped rather than filling the disk of the server.
wal_level = replica
archive_mode = on
archive_command = 'legarec-pgbackrest archive-push %p'
archive_timeout = 300

# The log never quotes a statement, a parameter, nor a row: an ERROR often does, so only what concerns the server is
# kept (LOG, FATAL, PANIC). The API logs the code of each error.
log_destination = 'stderr'
logging_collector = off
log_min_messages = log
log_min_error_statement = panic
log_error_verbosity = terse
log_statement = 'none'
log_min_duration_statement = -1
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] '
