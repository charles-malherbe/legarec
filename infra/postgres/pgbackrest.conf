# Backups, encrypted before they leave, in a bucket of their own. Region, address, keys and passphrase come from
# /etc/legarec/pgbackrest.env, read by legarec-pgbackrest: never here.
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-bucket=legarec-sauvegardes
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
# Days during which any moment can be restored (question 115).
repo1-retention-full-type=time
repo1-retention-full=70
repo1-bundle=y
repo1-block=y
compress-type=zst
process-max=2
start-fast=y
# A bucket that does not answer is a failure, not a wait.
archive-timeout=120
archive-push-queue-max=8GiB
# To the log of the container only.
log-level-console=info
log-level-file=off
lock-path=/tmp/pgbackrest

[legarec]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
pg1-database=postgres
