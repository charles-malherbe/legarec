# The superuser only signs in from inside the container, without any password on the network. Each program of the
# application has its account, and reaches its database only.
local   all      postgres                                          peer
local   all      all                                               reject
host    legarec  legarec_owner,legarec_app,legarec_jobs  samenet  scram-sha-256
host    all      all                                     all      reject
