# clamd of Legarec: reads what the worker sends it (INSTREAM), and nothing else. Logs on the standard output only.
# The socket is the one the start script of the image waits for.
LocalSocket /tmp/clamd.sock
# On every address of the container: it has one network only, closed, shared with the worker alone (docker-compose.yml).
TCPSocket 3310
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
# A file is 15 MB at most (FILE_MAX_BYTES): a stream above this is refused, never taken for clean.
StreamMaxLength 20M
# An archive that goes beyond what is read (size, depth, number of files) is answered FOUND, never OK.
AlertExceedsMax yes
MaxThreads 4
# One set of signatures in memory at a time: a reload makes the scans wait instead of doubling the memory.
ConcurrentDatabaseReload no
# The signatures are updated by another container, which cannot reach this one: looked at every 10 minutes, and loaded
# again when they have changed.
SelfCheck 600
