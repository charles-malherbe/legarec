# Signatures of ClamAV, fetched by a container of their own (`freshclam`), the only one of the two that has a way out.
# Logs on the standard output only.
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
# No NotifyClamd: clamd is in another container, out of reach; it finds the new signatures by itself (SelfCheck).
# clamd loads them anyway: testing them here first would hold a second copy in memory.
TestDatabases no
