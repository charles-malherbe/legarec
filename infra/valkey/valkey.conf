# Queues of the application. Their tasks are also in PostgreSQL; the password is added by legarec-valkey.
bind * -::*
protected-mode yes
port 6379
dir /data
databases 1
appendonly yes
appendfsync everysec
# The AOF is enough.
save ""
# Never forget a task to make room: a refusal is seen, a loss is not.
maxmemory 256mb
maxmemory-policy noeviction
# The slow log quotes commands.
slowlog-max-len 0
loglevel notice
