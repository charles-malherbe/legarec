# Collector: Docker hands each line to a socket of the server. Neither the Docker socket, nor the logs of the other
# containers of the server, nor any port.
service:
  flush: 2
  log_level: warn
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020
  health_check: on
pipeline:
  inputs:
    - name: forward
      unix_path: /journaux/fluent.sock
      unix_perm: '0600'
      mem_buf_limit: 32M
  filters:
    - name: record_modifier
      match: '*'
      remove_key: [container_id, partial_message, partial_id, partial_ordinal, partial_last]
  outputs:
    - name: loki
      match: 'legarec.*'
      host: loki
      port: 3100
      labels: 'application=legarec, container=$container_name, stream=$source'
      remove_keys: container_name, source
      drop_single_key: raw
      line_format: json
      retry_limit: 10
