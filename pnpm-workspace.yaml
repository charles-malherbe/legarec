packages:
  - apps/*
  - packages/*
saveExact: true
savePrefix: ''
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
# No install script runs: telemetry (@scarf/scarf), an optional native accelerator (msgpackr-extract), the engine
# downloads of Prisma (the client needs none) and the build of argon2 (its package holds the compiled addon).
allowBuilds:
  '@prisma/engines': false
  '@scarf/scarf': false
  argon2: false
  msgpackr-extract: false
  prisma: false
# Works with TypeScript 6; its peer range has not been widened yet.
peerDependencyRules:
  allowedVersions:
    'openapi-typescript>typescript': '6'
