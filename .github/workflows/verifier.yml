name: verifier
on:
  pull_request:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Empty services, thrown away with the job: their password protects nothing. No secret here, ever.
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_PASSWORD: verifier
        ports:
          - 127.0.0.1:55432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
      valkey:
        image: valkey/valkey:8.1.1
        ports:
          - 127.0.0.1:56379:6379
        options: --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:verifier@127.0.0.1:55432/postgres
      TEST_VALKEY_URL: redis://127.0.0.1:56379/0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verifier
      - run: pnpm --filter @legarec/api build
